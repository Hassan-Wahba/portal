<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة البورتال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#103F39;--pine-deep:#0B2A26;--gold:#C8A24B;--paper:#F5F3ED;
  --ink:#1B2422;--muted:#61706C;--line:#DFE6E3;--no:#B4453C;--ok:#2E7D5B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic','Noto Naskh Arabic',system-ui,sans-serif;
  background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.7}
h1,h2,h3,.dsp,button,label,select{font-family:'Tajawal','Noto Kufi Arabic',system-ui,sans-serif}
button{cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* top */
header{background:var(--pine-deep);color:#fff;padding:16px 0}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.1rem;font-weight:800;flex:1}
.warn-strip{background:#FBF3DE;border-bottom:1px solid #E8D9AC;padding:9px 0;font-size:.82rem;color:#7A5E14}

/* controls */
.bar{background:#fff;border-bottom:1px solid var(--line);padding:13px 0;position:sticky;top:0;z-index:20}
.brow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
select,input,textarea{
  font-family:inherit;font-size:.9rem;padding:8px 11px;border:1.5px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);width:100%;
}
select{cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:500}
textarea{resize:vertical;line-height:1.7}
input:focus,textarea:focus,select:focus{border-color:var(--pine);outline:none}
.sel-c{flex:2;min-width:170px}
.sel-w{flex:1;min-width:120px}
.btn{background:var(--pine);color:#fff;padding:9px 20px;border-radius:20px;font-weight:700;font-size:.86rem;transition:.16s;white-space:nowrap}
.btn:hover{background:var(--pine-deep)}
.btn.gold{background:var(--gold);color:var(--pine-deep)}
.btn.gold:hover{background:#B58F38}
.btn.sm{padding:6px 14px;font-size:.79rem}
.btn.ghost{background:transparent;color:var(--pine);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--paper)}

/* blocks */
main{padding:20px 0 70px}
.block{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.bhead{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);background:#FBFCFB}
.bhead h2{font-size:.95rem;font-weight:700;color:var(--pine);flex:1}
.tag{font-size:.74rem;color:var(--muted);background:var(--paper);padding:2px 9px;border-radius:10px}
.bbody{padding:15px}
label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.f{margin-bottom:13px}
.f:last-child{margin-bottom:0}

/* item rows */
.item{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:#FCFDFC}
.ihead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.inum{font-family:'Tajawal',sans-serif;font-weight:700;color:var(--gold);font-size:.82rem;flex:1}
.del{color:var(--no);font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:14px;transition:.14s}
.del:hover{background:#FBF0EF}
.two{display:flex;gap:9px}
.two>*{flex:1}
.radio-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.rb{border:1.5px solid var(--line);border-radius:16px;padding:5px 13px;font-size:.79rem;font-weight:500;background:#fff;transition:.14s}
.rb.on{background:var(--pine);color:#fff;border-color:var(--pine);font-weight:700}
.empty{text-align:center;color:var(--muted);font-size:.85rem;padding:14px 0}
.pub{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:10px;flex-wrap:wrap}
.pub.off{background:#F7F4EC;border:1.5px solid #E3D9BE}
.pub.on{background:#EEF7F2;border:1.5px solid #B8DCC8}
.pub .lab{flex:1;min-width:150px;font-size:.87rem}
.pub .lab b{font-family:'Tajawal',sans-serif;display:block;font-size:.92rem;margin-bottom:1px}
.pub.off .lab b{color:#7A5E14}
.pub.on .lab b{color:#1E5C41}
.pub .lab span{color:var(--muted);font-size:.79rem}
.sw{display:flex;gap:0;border-radius:20px;overflow:hidden;border:1.5px solid var(--line);background:#fff;flex:none}
.sw button{padding:7px 15px;font-size:.79rem;font-weight:700;font-family:'Tajawal',sans-serif;color:var(--muted);transition:.14s}
.sw button.on{background:var(--pine);color:#fff}
.fixed-slot{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fixed-slot .nm{font-family:'Tajawal',sans-serif;font-weight:700;font-size:.85rem;color:var(--pine);flex:none;min-width:140px}
.fixed-slot .in{flex:1;min-width:200px}
.hint{font-size:.79rem;color:var(--muted);margin-bottom:11px}

/* paste */
.paste textarea{min-height:120px;font-size:.85rem;font-family:ui-monospace,'DejaVu Sans Mono',monospace;direction:ltr;text-align:left}
.msg{margin-top:10px;padding:9px 13px;border-radius:8px;font-size:.84rem;display:none}
.msg.show{display:block}
.msg.good{background:#EEF7F2;color:#1E5C41;border-right:3px solid var(--ok)}
.msg.bad{background:#FBF0EF;color:#8E332C;border-right:3px solid var(--no)}

/* save bar */
.savebar{
  position:fixed;bottom:0;right:0;left:0;background:var(--pine);color:#fff;
  padding:11px 0;z-index:30;box-shadow:0 -3px 18px rgba(0,0,0,.13);
}
.srow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.srow .t{flex:1;font-size:.83rem;min-width:150px}
.srow .t b{font-family:'Tajawal',sans-serif}
@media(max-width:560px){ .two{flex-direction:column} header h1{font-size:1rem} }
</style>
</head>
<body>

<header><div class="wrap"><div class="hrow">
  <h1>لوحة إدارة البورتال</h1>
  <span style="font-size:.78rem;opacity:.6">للاستخدام على جهازك فقط</span>
</div></div></header>

<div class="warn-strip"><div class="wrap">
  التعديلات هنا مؤقتة في المتصفح. لازم تضغط <b>تحميل ملف المقرر</b> تحت، وترفع الملف على GitHub، عشان الطلبة يشوفوا التحديث.
</div></div>

<div class="bar"><div class="wrap"><div class="brow">
  <div class="sel-c"><select id="csel"></select></div>
  <div class="sel-w"><select id="wsel"></select></div>
</div></div></div>

<main><div class="wrap" id="app"></div></main>

<div class="savebar"><div class="wrap"><div class="srow">
  <div class="t" id="stat">جاهز</div>
  <button class="btn gold" onclick="ADM.download()">تحميل ملف المقرر</button>
</div></div></div>

<script>
window.COURSES=[];
window.registerCourse=function(c){window.COURSES.push(c);};
</script>
<script src="data/course-1.js"></script>
<script src="data/course-2.js"></script>
<script src="data/course-3.js"></script>
<script src="data/course-4.js"></script>

<script>
(function(){
"use strict";
var C=window.COURSES||[], ci=0, wi=0, dirty=false;
var FILES=["course-1.js","course-2.js","course-3.js","course-4.js"];

function ar(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[+d];});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
var SLOTS=["شرح السكشن","الملخص (ورقة واحدة)"];
function W(){
  var w=C[ci].weeks[wi];
  if(w.published===undefined) w.published=false;
  if(!Array.isArray(w.lectures)) w.lectures=[];
  /* the two named slots always exist, in order, for all 14 weeks */
  SLOTS.forEach(function(nm,k){
    if(!w.lectures[k] || w.lectures[k].title!==nm){
      var url=(w.lectures[k]&&w.lectures[k].url)||"";
      w.lectures[k]={title:nm,url:url,kind:"PDF"};
    }
  });
  return w;
}
function touch(){dirty=true;stat();}
function stat(){
  var pub=C[ci].weeks.filter(function(w){return w.published;}).length;
  document.getElementById("stat").innerHTML = (dirty
    ? '<b>فيه تعديلات لسه ما اتحمّلتش</b> — اضغط تحميل'
    : 'محفوظ. مفيش تعديلات معلّقة')
    + ' &nbsp;·&nbsp; <span style="opacity:.65">منشور: '+ar(pub)+' من '+ar(C[ci].weeks.length)+'</span>';
}

/* ── selectors ── */
function selectors(){
  var cs=document.getElementById("csel");
  cs.innerHTML=C.map(function(c,i){return '<option value="'+i+'">'+esc(c.title)+'</option>';}).join("");
  cs.value=ci;
  cs.onchange=function(){ if(!guard())return; ci=+this.value; wi=0; dirty=false; selectors(); draw(); };

  var ws=document.getElementById("wsel");
  ws.innerHTML=C[ci].weeks.map(function(w,i){
    return '<option value="'+i+'">الأسبوع '+ar(w.n||i+1)+(w.published?" — منشور":"")+'</option>';
  }).join("");
  ws.value=wi;
  ws.onchange=function(){ wi=+this.value; draw(); };
}
function guard(){
  if(!dirty) return true;
  return confirm("فيه تعديلات ما اتحمّلتش لسه. لو غيّرت المقرر هتضيع. تكمّل؟");
}

/* ── field helpers ── */
function txt(val,ph,fn,rows){
  var t=document.createElement(rows?"textarea":"input");
  if(rows)t.rows=rows;
  t.value=val||""; t.placeholder=ph||"";
  t.oninput=function(){ fn(this.value); touch(); };
  return t;
}
function field(lbl,node){
  var d=document.createElement("div"); d.className="f";
  var l=document.createElement("label"); l.textContent=lbl;
  d.appendChild(l); d.appendChild(node); return d;
}
function block(title,tag,bodyNode,addLabel,addFn){
  var b=document.createElement("section"); b.className="block";
  var h=document.createElement("div"); h.className="bhead";
  h.innerHTML='<h2>'+esc(title)+'</h2>'+(tag?'<span class="tag">'+esc(tag)+'</span>':'');
  if(addFn){
    var a=document.createElement("button");
    a.className="btn sm ghost"; a.textContent=addLabel;
    a.onclick=function(){ addFn(); touch(); draw(); };
    h.appendChild(a);
  }
  var bd=document.createElement("div"); bd.className="bbody";
  bd.appendChild(bodyNode);
  b.appendChild(h); b.appendChild(bd); return b;
}
function row(n,arr,i){
  var d=document.createElement("div"); d.className="item";
  var hd=document.createElement("div"); hd.className="ihead";
  hd.innerHTML='<span class="inum">'+esc(n)+'</span>';
  var x=document.createElement("button");
  x.className="del"; x.textContent="حذف";
  x.onclick=function(){ if(confirm("تأكيد الحذف؟")){ arr.splice(i,1); touch(); draw(); } };
  hd.appendChild(x); d.appendChild(hd); return d;
}
function emptyNote(t){ var d=document.createElement("div"); d.className="empty"; d.textContent=t; return d; }

/* ── draw ── */
function draw(){
  selectors(); stat();
  var app=document.getElementById("app"); app.innerHTML="";
  var w=W();

  /* publish switch */
  var pw=document.createElement("div");
  pw.className="pub "+(w.published?"on":"off");
  pw.innerHTML='<div class="lab"><b>'+(w.published?"منشور للطلبة":"مخفي عن الطلبة")+'</b>'+
    '<span>'+(w.published?"الأسبوع ظاهر ودايرته مفتوحة في البورتال."
      :"تقدر تحضّره وترفعه، والطالب مش هيشوفه.")+'</span></div>';
  var sw=document.createElement("div"); sw.className="sw";
  [["مخفي",false],["منشور",true]].forEach(function(o){
    var b=document.createElement("button");
    b.className=(w.published===o[1]?"on":""); b.textContent=o[0];
    b.onclick=function(){ w.published=o[1]; touch(); draw(); };
    sw.appendChild(b);
  });
  pw.appendChild(sw);
  var pb=document.createElement("section"); pb.className="block";
  var pbd=document.createElement("div"); pbd.className="bbody"; pbd.appendChild(pw);
  pb.appendChild(pbd); app.appendChild(pb);

  /* week meta */
  var meta=document.createElement("div");
  meta.appendChild(field("عنوان الأسبوع", txt(w.title,"مثال: الدورة المحاسبية وقيود التسوية",function(v){w.title=v;})));
  meta.appendChild(field("سطر تعريفي (اختياري)", txt(w.summary,"جملة تقول للطالب هيتعلم إيه في الأسبوع ده",function(v){w.summary=v;},2)));
  app.appendChild(block("بيانات الأسبوع","الأسبوع "+ar(w.n||wi+1),meta));

  /* 1 — section: two fixed slots, same in all 14 weeks */
  var L=document.createElement("div");
  var hint=document.createElement("div"); hint.className="hint";
  hint.textContent="الخانة اللي تسيبها فاضية مش هتظهر للطالب.";
  L.appendChild(hint);
  w.lectures.forEach(function(l,i){
    if(i>=SLOTS.length) return;
    var r=document.createElement("div"); r.className="fixed-slot";
    var nm=document.createElement("span"); nm.className="nm"; nm.textContent=l.title;
    var box=document.createElement("div"); box.className="in";
    box.appendChild(txt(l.url,"الصق لينك الملف من جوجل درايف",function(v){l.url=v;}));
    r.appendChild(nm); r.appendChild(box); L.appendChild(r);
  });
  var nfill=w.lectures.filter(function(l){return l.url&&l.url.trim();}).length;
  app.appendChild(block("١ · السكشن", ar(nfill)+" من "+ar(SLOTS.length), L));

  /* problems */
  var P=document.createElement("div");
  if(!w.problems.length) P.appendChild(emptyNote("مفيش مسائل مضافة"));
  w.problems.forEach(function(p,i){
    var d=row("مسألة "+ar(i+1),w.problems,i);
    d.appendChild(field("نص المسألة", txt(p.q,"اكتب المطلوب من الطالب",function(v){p.q=v;},3)));
    d.appendChild(field("الحل", txt(p.solution,"الحل اللي هيظهر لما يضغط عرض الحل",function(v){p.solution=v;},4)));
    P.appendChild(d);
  });
  app.appendChild(block("٢ · مسائل وتدريبات", ar(w.problems.length)+" مسألة", P, "+ مسألة",
    function(){ w.problems.push({q:"",solution:""}); }));

  /* quiz */
  var Q=document.createElement("div");
  if(!w.quiz.length) Q.appendChild(emptyNote("مفيش أسئلة مضافة"));
  w.quiz.forEach(function(q,i){
    var d=row("سؤال "+ar(i+1),w.quiz,i);
    d.appendChild(field("السؤال", txt(q.q,"نص السؤال",function(v){q.q=v;},2)));
    if(!q.options) q.options=["","","",""];
    q.options.forEach(function(o,k){
      d.appendChild(field("اختيار "+ar(k+1), txt(o,"",function(v){q.options[k]=v;})));
    });
    var lab=document.createElement("label"); lab.textContent="الإجابة الصحيحة";
    var rr=document.createElement("div"); rr.className="radio-row";
    q.options.forEach(function(o,k){
      var b=document.createElement("button");
      b.className="rb"+(q.answer===k?" on":""); b.textContent="اختيار "+ar(k+1);
      b.onclick=function(){ q.answer=k; touch(); draw(); };
      rr.appendChild(b);
    });
    var fw=document.createElement("div"); fw.className="f";
    fw.appendChild(lab); fw.appendChild(rr); d.appendChild(fw);
    d.appendChild(field("سبب الإجابة", txt(q.why,"يظهر للطالب بعد ما يجاوب",function(v){q.why=v;},2)));
    Q.appendChild(d);
  });
  app.appendChild(block("٣ · اختبار قصير", ar(w.quiz.length)+" سؤال", Q, "+ سؤال",
    function(){ w.quiz.push({q:"",options:["","","",""],answer:0,why:""}); }));

  /* cards */
  var F=document.createElement("div");
  if(!w.cards.length) F.appendChild(emptyNote("مفيش مصطلحات مضافة"));
  w.cards.forEach(function(c0,i){
    var d=row("مصطلح "+ar(i+1),w.cards,i);
    var two=document.createElement("div"); two.className="two";
    two.appendChild(field("الوجه", txt(c0.front,"المصطلح — Term",function(v){c0.front=v;})));
    two.appendChild(field("الظهر", txt(c0.back,"التعريف",function(v){c0.back=v;},2)));
    d.appendChild(two); F.appendChild(d);
  });
  app.appendChild(block("٤ · مصطلحات", ar(w.cards.length)+" مصطلح", F, "+ مصطلح",
    function(){ w.cards.push({front:"",back:""}); }));

  /* paste from Claude */
  var pz=document.createElement("div"); pz.className="paste";
  var ta=document.createElement("textarea");
  ta.placeholder='{ "title": "...", "quiz": [...], "cards": [...] }';
  pz.appendChild(field("الصق محتوى الأسبوع اللي جالك من كلود", ta));
  var mg=document.createElement("div"); mg.className="msg";
  var go=document.createElement("button"); go.className="btn"; go.textContent="أضف للأسبوع الحالي";
  go.onclick=function(){
    var raw=ta.value.trim().replace(/^```(json)?/,"").replace(/```$/,"").trim();
    var o;
    try{ o=JSON.parse(raw); }
    catch(e){ mg.className="msg show bad"; mg.textContent="النص مش JSON سليم. تأكد إنك نسخت الكتلة كاملة من { لـ }."; return; }
    var n=0, cur=W();
    if(o.title){ cur.title=o.title; n++; }
    if(o.summary){ cur.summary=o.summary; n++; }
    ["problems","quiz","cards"].forEach(function(k){
      if(Array.isArray(o[k])){ cur[k]=cur[k].concat(o[k]); n+=o[k].length; }
    });
    if(!n){ mg.className="msg show bad"; mg.textContent="مفيش حاجة اتضافت — الملف مفيهوش الحقول المتوقعة."; return; }
    mg.className="msg show good"; mg.textContent="تمت إضافة "+ar(n)+" عنصر. راجعهم فوق ثم حمّل الملف.";
    ta.value=""; touch();
    setTimeout(draw,700);
  };
  pz.appendChild(go); pz.appendChild(mg);
  app.appendChild(block("إضافة سريعة","لصق",pz));
}

/* ── export ── */
function download(){
  var c=C[ci];
  var body="/* "+c.title+" — ملف محتوى المقرر. عدّله من admin.html، لا تعدّله يدويًا. */\n"+
           "registerCourse(\n"+JSON.stringify(c,null,2)+"\n);\n";
  var blob=new Blob([body],{type:"text/javascript;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=FILES[ci];
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1200);
  dirty=false; stat();
}
window.ADM={download:download};

window.addEventListener("beforeunload",function(e){
  if(dirty){ e.preventDefault(); e.returnValue=""; }
});

if(!C.length){
  document.getElementById("app").innerHTML=
    '<div class="block"><div class="bbody"><b>ملفات المقررات مش محمّلة.</b><br>'+
    'تأكد إن admin.html في نفس الفولدر اللي فيه <code>data</code>.</div></div>';
} else { draw(); }
})();
</script>
</body>
</html>
